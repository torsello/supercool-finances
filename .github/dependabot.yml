# Keeps the pinned versions current (section 1.6 of spec 008): the base images of the Dockerfile,
# the images of compose.yaml (each pinned by version and digest, DEP-R22), the npm dependencies and
# the GitHub Actions of the workflows (pinned by commit). Images stay on the major versions the
# stack specifies (Node 24, PostgreSQL 16, Redis 7, AGENTS.md section 4), and nginx on the 1.28
# stable branch (plan 008 section 3), so a major or mainline bump is a decision, not an update.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: nginx
        versions: ['>= 1.29']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
