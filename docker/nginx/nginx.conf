# Main configuration of the local load balancer (spec 008 section 1.5). The server configuration
# is rendered from templates/default.conf.template into conf.d by the image's envsubst step, and
# included inside http below.

user nginx;

# One worker keeps the round robin over the two replicas strictly alternating (DEP-R15): each
# worker keeps its own round-robin position, so with several workers consecutive requests can land
# on the same replica, and DEP-AC09 counts requests per replica.
worker_processes 1;
worker_rlimit_nofile 20480;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    # Each proxied request holds a client and an upstream connection: room for the 3000 clients at
    # once of SEC-AC01.
    worker_connections 10240;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    include /etc/nginx/conf.d/*.conf;
}
