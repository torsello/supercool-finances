# The Prometheus of the observability profile (section 1.9 of spec 008): one job scraping /metrics
# of both replicas on METRICS_PORT inside the compose network every 5 seconds (DEP-R43), each target
# labelled with its replica for the dashboard.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: scf-api
    static_configs:
      - targets: ['api-1:9464']
        labels:
          replica: api-1
      - targets: ['api-2:9464']
        labels:
          replica: api-2
