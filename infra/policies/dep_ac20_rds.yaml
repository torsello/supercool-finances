metadata:
  id: 'SCF_DEP_AC20_RDS'
  name: 'DEP-AC20: RDS runs PostgreSQL 16 in Multi-AZ, encrypted with a KMS key, private, with deletion protection, 7 days of backups and a parameter group'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'engine'
      operator: 'equals'
      value: 'postgres'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'engine_version'
      operator: 'starting_with'
      value: '16'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'multi_az'
      operator: 'is_true'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'storage_encrypted'
      operator: 'is_true'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'kms_key_id'
      operator: 'exists'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'publicly_accessible'
      operator: 'is_false'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'deletion_protection'
      operator: 'is_true'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'backup_retention_period'
      operator: 'equals'
      value: 7
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'parameter_group_name'
      operator: 'exists'
