metadata:
  id: 'SCF_DEP_AC23_RDS_STORAGE_EVENTS_NOTIFY'
  name: 'DEP-AC23: the RDS storage events reach the one SNS topic'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_sns_topic']
    - cond_type: 'connection'
      resource_types: ['aws_sns_topic']
      connected_resource_types: ['aws_cloudwatch_event_target']
      operator: 'one_exists'
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_event_target']
      attribute: 'rule'
      operator: 'equals'
      value: 'scf-rds-storage'
