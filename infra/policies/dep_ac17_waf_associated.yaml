metadata:
  id: 'SCF_DEP_AC17_WAF_ASSOCIATED'
  name: 'DEP-AC17: a WAF web ACL is associated with the ALB'
  category: 'NETWORKING'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_lb']
    - cond_type: 'connection'
      resource_types: ['aws_lb']
      connected_resource_types: ['aws_wafv2_web_acl_association']
      operator: 'one_exists'
