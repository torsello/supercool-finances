metadata:
  id: 'SCF_DEP_AC22_SERVICE_SECRETS'
  name: 'DEP-AC22: the service reads JWT_SECRET, CURSOR_SECRET, PGPASSWORD and REDIS_URL from their Secrets Manager secrets'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_ecs_service']
    - cond_type: 'connection'
      resource_types: ['aws_ecs_service']
      connected_resource_types: ['aws_ecs_task_definition']
      operator: 'one_exists'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'regex_match'
      value: '.*''name'': ''JWT_SECRET'', ''valueFrom'': ''aws_secretsmanager_secret\.jwt_secret\.arn''.*'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'regex_match'
      value: '.*''name'': ''CURSOR_SECRET'', ''valueFrom'': ''aws_secretsmanager_secret\.cursor_secret\.arn''.*'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'regex_match'
      value: '.*''name'': ''PGPASSWORD'', ''valueFrom'': ''aws_secretsmanager_secret\.db_runtime\.arn:password::''.*'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'regex_match'
      value: '.*''name'': ''REDIS_URL'', ''valueFrom'': ''aws_secretsmanager_secret\.redis\.arn:url::''.*'
