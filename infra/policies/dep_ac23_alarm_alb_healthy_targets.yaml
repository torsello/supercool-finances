metadata:
  id: 'SCF_DEP_AC23_ALARM_ALB_HEALTHY_TARGETS'
  name: 'DEP-AC23: the alarm ALB healthy targets fewer than 2 exists'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_sns_topic']
    - cond_type: 'connection'
      resource_types: ['aws_sns_topic']
      connected_resource_types: ['aws_cloudwatch_metric_alarm']
      operator: 'one_exists'
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_metric_alarm']
      attribute: 'metric_name'
      operator: 'equals'
      value: 'HealthyHostCount'
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_metric_alarm']
      attribute: 'statistic'
      operator: 'equals'
      value: 'Minimum'
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_metric_alarm']
      attribute: 'period'
      operator: 'equals'
      value: 60
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_metric_alarm']
      attribute: 'comparison_operator'
      operator: 'equals'
      value: 'LessThanThreshold'
    - cond_type: 'attribute'
      resource_types: ['aws_cloudwatch_metric_alarm']
      attribute: 'threshold'
      operator: 'equals'
      value: 2
