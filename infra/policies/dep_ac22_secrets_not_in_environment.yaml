metadata:
  id: 'SCF_DEP_AC22_SECRETS_NOT_IN_ENVIRONMENT'
  name: 'DEP-AC22: no task definition passes a secret, or a URL holding a password, through environment'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'not_regex_match'
      value: ".*'name': '(JWT_SECRET|CURSOR_SECRET|PGPASSWORD|REDIS_URL|OWNER_ROLE_PASSWORD|RUNTIME_ROLE_PASSWORD)', 'value': .*"
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_task_definition']
      attribute: 'container_definitions'
      operator: 'not_regex_match'
      value: ".*'value': '(postgres|postgresql|redis|rediss)://[^@/']*:[^@/']*@.*"
