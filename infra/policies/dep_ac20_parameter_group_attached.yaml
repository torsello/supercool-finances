metadata:
  id: 'SCF_DEP_AC20_PARAMETER_GROUP_ATTACHED'
  name: 'DEP-AC20: the instance uses a parameter group with rds.force_ssl 1'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_db_instance']
    - cond_type: 'connection'
      resource_types: ['aws_db_instance']
      connected_resource_types: ['aws_db_parameter_group']
      operator: 'one_exists'
    - cond_type: 'attribute'
      resource_types: ['aws_db_parameter_group']
      attribute: "parameter[?(@.name == 'rds.force_ssl')].value"
      operator: 'jsonpath_equals'
      value: '1'
