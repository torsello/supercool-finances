metadata:
  id: 'SCF_DEP_AC22_RDS_MASTER_SECRET'
  name: "DEP-AC22: RDS manages its master password in Secrets Manager, with the secrets module's key, and no password is set in Terraform"
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'manage_master_user_password'
      operator: 'is_true'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: '$.master_user_secret_kms_key_id'
      operator: 'jsonpath_equals'
      value: 'aws_kms_key.secrets.arn'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'password'
      operator: 'not_exists'
    - cond_type: 'attribute'
      resource_types: ['aws_db_instance']
      attribute: 'password_wo'
      operator: 'not_exists'
