# Any such resource fails: secret_id is a required argument.
metadata:
  id: 'SCF_DEP_AC22_NO_SECRET_VERSION'
  name: 'DEP-AC22: no aws_secretsmanager_secret_version resource, which would put a secret value in the state'
  category: 'GENERAL_SECURITY'
definition:
  cond_type: 'attribute'
  resource_types: ['aws_secretsmanager_secret_version']
  attribute: 'secret_id'
  operator: 'not_exists'
