metadata:
  id: 'SCF_DEP_AC18_SERVICE'
  name: 'DEP-AC18: the ECS service runs on Fargate, at least 2 tasks, keeping 100% healthy during a deployment and rolling it back through the circuit breaker, in the private subnets'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: 'launch_type'
      operator: 'equals'
      value: 'FARGATE'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: 'desired_count'
      operator: 'greater_than_or_equal'
      value: 2
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: 'deployment_minimum_healthy_percent'
      operator: 'equals'
      value: 100
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: '$.network_configuration.subnets'
      operator: 'jsonpath_equals'
      value: 'aws_subnet.private[*].id'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: 'deployment_circuit_breaker.enable'
      operator: 'is_true'
    - cond_type: 'attribute'
      resource_types: ['aws_ecs_service']
      attribute: 'deployment_circuit_breaker.rollback'
      operator: 'is_true'
