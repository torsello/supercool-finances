metadata:
  id: 'SCF_DEP_AC20_PROXY_FRONTS_RDS'
  name: 'DEP-AC20: an RDS Proxy target fronts the instance'
  category: 'GENERAL_SECURITY'
definition:
  and:
    - cond_type: 'filter'
      attribute: 'resource_type'
      operator: 'within'
      value: ['aws_db_instance']
    - cond_type: 'connection'
      resource_types: ['aws_db_instance']
      connected_resource_types: ['aws_db_proxy_target']
      operator: 'one_exists'
