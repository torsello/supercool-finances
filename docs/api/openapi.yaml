    get:
      operationId: listAccounts
      summary: List own accounts
      tags:
        - accounts
      description: 'A customer lists their own accounts. Operators look accounts up by
        id and get 403 here. Newest first by (`createdAt`, `id`), one page as
        `{"items": [...], "nextCursor": "..."}`; `nextCursor` is absent on the
        last page. `limit` is an integer from 1 to 100, 20 when absent; any
        other value answers 422 `/problems/validation-error`. Pass `nextCursor`
        back as `cursor` for the next page: it is opaque, signed by the service,
        valid on every replica, and only for the same list and user; an altered
        or foreign cursor answers 400 `/problems/malformed-request`.'
      parameters:
        - schema:
            type: string
            pattern: ^[1-9][0-9]*$
          in: query
          name: limit
          required: false
          description: The page size, an integer from 1 to 100; 20 when absent.
          example: "20"
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: The `nextCursor` of the previous page of the same list, as given;
            absent for the first page.
