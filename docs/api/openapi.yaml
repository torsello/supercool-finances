            (300 by default) authenticated requests within a window of
            `RATE_LIMIT_USER_WINDOW_S` (10 by default) seconds that starts at
            the user's first request, refused ones and replays included;
            `Retry-After` is the whole seconds left in the window. Or one client
            IP passed the per-IP limit in front of the service: nginx answers
            with `Retry-After: 1`, and AWS WAF with `Retry-After: 60` and a body
            of content type `application/json` without `requestId`. Nothing is
