                  value:
                    type: /problems/insufficient-funds-for-reversal
                    title: Insufficient Funds For Reversal
                    status: 422
                    detail: An account balance does not cover the reversal.
                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
                balance-limit-exceeded:
                  summary: Balance Limit Exceeded
                  value:
                    type: /problems/balance-limit-exceeded
                    title: Balance Limit Exceeded
                    status: 422
                    detail: The movement would take a balance above its limit.
