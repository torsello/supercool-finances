                additionalProperties: false
              example:
                items:
                  - id: 0199c3a2-0b61-7e6f-8a41-8c9d0e1f2a3b
                    transactionId: 0199c3a2-0b60-7d5e-9f30-7b8c9d0e1f2a
                    kind: withdrawal
                    amount: "-1200"
                    currency: EUR
                    createdAt: 2026-10-08T15:20:41.007Z
