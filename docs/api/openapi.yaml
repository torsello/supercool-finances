                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
                upstream-unavailable:
                  summary: Upstream Unavailable
                  value:
                    type: /problems/upstream-unavailable
                    title: Upstream Unavailable
                    status: 503
                    detail: No replica of the service answered; retry later, with the same
                      Idempotency-Key if the request had one.
                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
        "504":
          description: "Gateway Timeout, as problem details.
            `/problems/upstream-unavailable`: Answered by the load balancer, not
