  /v1/accounts/{id}/entries:
    get:
      operationId: listAccountEntries
      summary: List an account's history
      tags:
        - accounts
      description: "The account's ledger entries, each with a signed amount in minor
        units (\"5000\" adds to the balance, \"-1200\" subtracts), without
        counterparty or running balance. A customer lists their own accounts; an
        operator any customer account. Newest first by (`createdAt`, `id`), one
        page as `{\"items\": [...], \"nextCursor\": \"...\"}`; `nextCursor` is
        absent on the last page. `limit` is an integer from 1 to 100, 20 when
        absent; any other value answers 422 `/problems/validation-error`. Pass
        `nextCursor` back as `cursor` for the next page: it is opaque, signed by
        the service, valid on every replica, and only for the same list and
        user; an altered or foreign cursor answers 400
        `/problems/malformed-request`."
      parameters:
        - schema:
            type: string
            pattern: ^[1-9][0-9]*$
          in: query
          name: limit
          required: false
          description: The page size, an integer from 1 to 100; 20 when absent.
          example: "20"
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: The `nextCursor` of the previous page of the same list, as given;
            absent for the first page.
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: The account id, a UUID.
          example: 0199c3a1-2f40-7a3b-8c1d-5e6f7a8b9c0d
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: One page of the account’s ledger entries, newest first.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
