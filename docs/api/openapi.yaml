                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
        "503":
          description: "Service Unavailable, as problem details.
            `/problems/service-unavailable`: A transient condition of a replica,
            with `Retry-After: 1`: no database connection free within
            `DB_POOL_ACQUIRE_TIMEOUT_MS`, or in AWS none free at RDS Proxy
            within its 5 s borrow timeout, an account lock not acquired in time,
            a deadlock or serialization failure still present after 3 attempts,
            a statement timeout, a database connection lost while a statement
            ran (SEC-R57), the request timeout `REQUEST_TIMEOUT_MS` (25 s by
            default) reached, or the replica shutting down. Nothing is stored,
            and the transaction rolls back; only at the request timeout after
            the `COMMIT` was sent, or for a connection lost during `COMMIT`, may
            the commit have succeeded, with an outcome unknown to the client.
            Retry after `Retry-After`, with the same `Idempotency-Key` for a
            POST, which then gets the stored response if the movement committed.
            `/problems/upstream-unavailable`: Answered by the load balancer, not
            by a replica: no replica answered, one sent a broken response, or
            none answered in time. Locally nginx answers it as problem details;
            in AWS the ALB answers its own 502, 503 and 504 as `text/html`
            without a problem body, `Retry-After` or `X-Request-Id`, so a client
            keys on the status, as the retry policy does. The outcome of a POST
            is unknown: retry after `Retry-After` (1 second) with the same
            `Idempotency-Key`, which answers the stored response if the movement
            committed."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
