  /v1/accounts/{id}/deposits:
    post:
      operationId: deposit
      summary: Deposit
      tags:
        - movements
      description: "Operators only: simulates money arriving from a payment rail into
        any customer account, credited to the account and debited to the
        currency's settlement account. The response has no balance. The currency
        must be the account's (422 `/problems/currency-mismatch`); a frozen or
        closed account answers 422 `/problems/account-not-active`. Another
        customer's account, a system account, an unknown id and an id that is
        not a UUID answer 404. A balance that would pass the maximum answers 422
        `/problems/balance-limit-exceeded`. Requires an `Idempotency-Key` header
        of 1 to 255 visible ASCII characters, fresh for each new request; a
        missing or malformed one answers 400 `/problems/malformed-request`. A
        repeat with the same key and body answers the stored response with
        `Idempotent-Replayed: true`; the same key with another body answers 422
        `/problems/idempotency-key-reused`; while the first request is still
        running, 409 `/problems/request-in-progress` with `Retry-After: 1`:
        retry with the same key. Answers 201 with `Location:
        /v1/transactions/{id}`. A lock or retry that runs out answers 503
        `/problems/service-unavailable` with `Retry-After: 1`; retry with the
        same key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  description: "A positive amount in minor units of the currency (cents for EUR,
                    whole yen for JPY), as a string of decimal digits without
                    sign, leading zero, separator or exponent: \"1050\" is 10.50
                    EUR. At most 100000000000, the service's MAX_AMOUNT_MINOR; a
                    larger amount answers 422."
                  type: string
                currency:
                  type: string
                  enum:
                    - USD
                    - MXN
                    - EUR
                    - COP
                    - JPY
              required:
                - amount
                - currency
              additionalProperties: false
            example:
              amount: "1050"
              currency: EUR
        description: The amount in minor units of the currency, and the account’s currency.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: The account id, a UUID.
          example: 0199c3a1-2f40-7a3b-8c1d-5e6f7a8b9c0d
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          description: "The deposit transaction, without a balance; `Location` is its
            path. A replay carries `Idempotent-Replayed: true`."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: The path of the created resource, under `/v1`.
              schema:
                type: string
              example: /v1/transactions/0199c3a2-0b60-7d5e-9f30-7b8c9d0e1f2a
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
