                transaction-not-reversible:
                  summary: Transaction Not Reversible
                  value:
                    type: /problems/transaction-not-reversible
                    title: Transaction Not Reversible
                    status: 422
                    detail: A reversal cannot be reversed.
                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
                account-not-active:
                  summary: Account Not Active
                  value:
                    type: /problems/account-not-active
                    title: Account Not Active
                    status: 422
                    detail: The account is frozen or closed.
                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
                insufficient-funds-for-reversal:
