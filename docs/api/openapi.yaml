                    title: Payload Too Large
                    status: 413
                    detail: The request body is larger than 16384 bytes.
                    requestId: 0199c3a2-7b10-7c4e-9a52-3f1e2d4c5b60
        "415":
          description: "Unsupported Media Type, as problem details.
            `/problems/unsupported-media-type`: The request has a body and its
