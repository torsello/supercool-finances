  /v1/transactions/{id}:
    get:
      operationId: readTransaction
      summary: Read a transaction
      tags:
        - transactions
      description: An operator sees every entry of any transaction; a customer sees a
        transaction with an entry on one of their own accounts, and only those
        entries. Entry amounts are signed minor units. Anything else answers 404
        `/problems/not-found`.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
          description: The transaction id, a UUID.
          example: 0199c3a2-0b60-7d5e-9f30-7b8c9d0e1f2a
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: "The transaction and its entries, signed amounts in minor units:
            every entry for an operator, only those on the caller’s own accounts
            for a customer."
